; Drain3 settings for Lighthouse. sim_th was tuned on HDFS and BGL only (see DECISIONS.md D5).
[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = False

[MASKING]
masking = [{"regex_pattern": "\\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\b", "mask_with": "UUID"}, {"regex_pattern": "blk_-?\\d+", "mask_with": "BLOCK"}, {"regex_pattern": "\\bORD-\\d+\\b", "mask_with": "ORDER"}, {"regex_pattern": "\\bSKU-\\d+\\b", "mask_with": "SKU"}, {"regex_pattern": "\\bu\\d{5}\\b", "mask_with": "USER"}, {"regex_pattern": "(?<![\\w.])(?:\\d{1,3}\\.){3}\\d{1,3}(?::\\d+)?(?![\\w.])", "mask_with": "IP"}, {"regex_pattern": "(?<![\\w])(?:0x)?[0-9a-fA-F]{8,}(?![\\w])", "mask_with": "HEX"}, {"regex_pattern": "(?<![\\w.])[-+]?\\d+(?:\\.\\d+)?(?:ms|us|s|min|h|KB|MB|GB|B)?(?![\\w])", "mask_with": "NUM"}]
mask_prefix = <
mask_suffix = >

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 2000
extra_delimiters = ["="]

[PROFILING]
enabled = False
report_sec = 30
